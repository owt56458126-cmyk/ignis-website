<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignis - 聯絡我們</title>
    <link rel="stylesheet" href="ignis.css">
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <header class="hero-section">
            <h1 class="brand-title">IGNIS</h1>
            <p class="brand-tagline">學生會候選內閣</p>
        </header>

        <nav class="sticky-navbar">
            <div class="nav-tabs">
                <a href="ignis.html" class="nav-link-btn">主頁</a>
                <a href="platform.html" class="nav-link-btn">政綱</a>
                <a href="welfare.html" class="nav-link-btn">福利</a>
                <a href="events.html" class="nav-link-btn">活動</a>
                <button class="nav-link active">聯絡我們</button>
            </div>
            <div class="search-container">
                <input type="text" id="contactSearchInput" placeholder="搜尋聯絡資訊..." onkeypress="handleContactSearch(event)">
                <button class="search-btn" onclick="executeContactSearch()">搜尋</button>
            </div>
        </nav>

        <main class="content-sections">

            <div class="category-header">聯絡我們</div>

            <div class="welfare-grid" id="contactList">
                <div class="welfare-card">
                    <h3>Instagram</h3>
                    <p>追縱我們的最新動態與即時消息：<br><strong>@ignis_su2026</strong></p>
                </div>

                <div class="welfare-card">
                    <h3>電郵查詢</h3>
                    <p>如有任何疑問或建議，歡迎電郵至：<br><strong>ignis.su@school.edu.hk</strong></p>
                </div>

                <div class="welfare-card">
                    <h3>學生會室</h3>
                    <p>歡迎於課餘時間親臨學生會室與我們交流意見。</p>
                </div>

                <div class="welfare-card">
                    <h3>意見箱</h3>
                    <p>可透過校園地下意見箱或線上 Google Form 隨時反映訴求。</p>
                </div>
            </div>

        </main>

        <footer class="main-footer">
            <p>© 2026 學生會候選內閣 IGNIS.</p>
        </footer>
    </div>

    <script src="ignis.js"></script>
    <script>
        function handleContactSearch(event) {
            if (event.key === 'Enter') {
                executeContactSearch();
            }
        }

        function executeContactSearch() {
            const input = document.getElementById('contactSearchInput');
            if (!input) return;

            const query = input.value.toLowerCase().trim();
            const cards = document.querySelectorAll('#contactList .welfare-card');

            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
