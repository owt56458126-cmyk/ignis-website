<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">

    <title>Ignis - 福利服務</title>
    <link rel="stylesheet" href="ignis.css">
    <link href="https://fonts.googleapis.com/css2?family=Impact&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        
        <header class="hero-section">
            <h1 class="brand-title">IGNIS</h1>
            <p class="brand-tagline">學生會候選內閣</p>
        </header>

        <nav class="sticky-navbar">
            <div class="nav-tabs">
                <a href="ignis.html" class="nav-link-btn">主頁</a>
                <a href="platform.html" class="nav-link-btn">政綱</a>

            </div>
            <div class="search-container">
                <input type="text" id="welfareSearchInput" placeholder="搜尋福利..." onkeypress="handleWelfareSearch(event)">

        <main class="content-sections">

            <div class="category-header">校園福利</div>

            <section class="about-card" style="text-align: center; padding: 3rem 1.5rem; margin-top: 1.5rem;">
                <h2 style="color: #ff6600; font-size: 1.8rem; margin-bottom: 0.5rem;">待定</h2>
                <p style="color: #aaaaaa; font-size: 1rem;">福利詳情正在籌備與洽談中，敬請期待！</p>
            </section>

        </main>

        <footer class="main-footer">
            <p>© 2026 學生會候選內閣 IGNIS.</p>
        </footer>
    </div>
